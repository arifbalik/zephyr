description: |
  Input driver for STM32 Touch Sensing Controller (TSC).

  This node is a st,stm32-tsc grandchild node and applies filters and
  calculations to detect an input event on a group which is the child of
  st,stm32-tsc. For more information see dts/bindings/input/st,stm32-tsc.yaml

compatible: "tsc-keys"

include:
  - name: base.yaml
    property-allowlist:
      - compatible
      - zephyr,deferred-init
      - label
      - status

properties:
  sampling-interval-ms:
    type: int
    required: true
    description: |
      Sampling interval in milliseconds.
  oversampling:
    type: int
    deprecated: true
    description: |
      Unused. The time window over which a press or release is detected is
      CONFIG_INPUT_STM32_TSC_KEYS_BUFFER_WORD_SIZE samples taken every
      sampling-interval-ms milliseconds.
  noise-threshold:
    type: int
    required: true
    description: |
      This value will be used to reject the noise for both
      directions of the slope.
  sticky-key-timeout-ms:
    type: int
    required: true
    description: |
      Time in milliseconds after a reported press within which a release
      must be detected. If none is detected by then, a release event is
      generated and the key returns to the released state.
  zephyr,code:
    type: int
    required: true
    description: Key code to emit.

examples:
  - |
    #include <zephyr/dt-bindings/input/input-event-codes.h>

    &tsc {
      compatible = "st,stm32-tsc";

      tsc_group6: g6 {
        /* ... */
        ts1 {
          compatible = "tsc-keys";
          sampling-interval-ms = <10>;
          noise-threshold = <50>;
          sticky-key-timeout-ms = <10000>;
          zephyr,code = <INPUT_KEY_0>;
        };
      };
    };
